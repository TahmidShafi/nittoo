name: CI

on:
  push:
    branches: [main, chore/testing-ci]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck, Lint, Unit & E2E Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Unit tests & coverage
        run: npx vitest run --coverage

      - name: Build production bundle
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E tests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  supabase-rls:
    name: Local Supabase Migrations & RLS Isolation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.1.0

      - name: Initialize local Supabase config if absent
        run: |
          if [ ! -f supabase/config.toml ]; then
            supabase init --with-vscode-settings=false --with-intellij-settings=false
          fi

      - name: Start local Supabase & reset database with migrations
        run: |
          supabase start
          supabase db reset

      - name: Run RLS isolation verification against local Supabase
        run: |
          supabase status -o env > /tmp/supabase.env
          API_URL=$(grep '^API_URL=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')
          ANON_KEY=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')
          printf 'VITE_SUPABASE_URL=%s\nVITE_SUPABASE_ANON_KEY=%s\n' "$API_URL" "$ANON_KEY" > .env
          npx tsx scripts/integration/verify-supabase-rls.ts

      - name: Stop local Supabase
        if: always()
        run: supabase stop || true
