version: 2

models:
  - name: dim_product
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: user_id
        tests: [not_null]
      - name: category
        tests: [not_null]
      - name: size_unit
        tests:
          - accepted_values:
              values: ["ml", "g", "count"]

  - name: dim_vendor
    columns:
      - name: vendor_key
        tests: [unique, not_null]
      - name: vendor_name
        tests: [not_null]

  - name: dim_date
    columns:
      - name: date_day
        tests: [unique, not_null]

  - name: fact_purchase
    columns:
      - name: purchase_id
        tests: [unique, not_null]
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: vendor_key
        tests:
          - not_null
          - relationships:
              to: ref('dim_vendor')
              field: vendor_key
      - name: purchase_date
        tests:
          - not_null
          - relationships:
              to: ref('dim_date')
              field: date_day
      - name: price
        tests: [not_null]

  - name: fact_consumption_cycle
    columns:
      - name: usage_period_id
        tests: [unique, not_null]
      - name: product_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_product')
              field: product_id
      - name: purchase_id
        tests:
          - not_null
          - relationships:
              to: ref('fact_purchase')
              field: purchase_id
      - name: status
        tests:
          - not_null
          - accepted_values:
              values: ["completed", "active"]

  - name: mart_monthly_spend
    columns:
      - name: user_id
        tests: [not_null]
      - name: spend_month
        tests: [not_null]
      - name: category
        tests: [not_null]
      - name: total_spend_bdt
        tests: [not_null]

  - name: mart_category_price_index
    columns:
      - name: category
        tests: [not_null]
      - name: size_unit
        tests: [not_null]
      - name: price_month
        tests: [not_null]
      - name: avg_unit_price
        tests: [not_null]
